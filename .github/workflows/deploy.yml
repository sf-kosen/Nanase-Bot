name: Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          echo "Release ${RELEASE_TAG} detected"
          cd /home/sora81dev/discord-bot/nanase-bot
          git fetch --all --tags
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
